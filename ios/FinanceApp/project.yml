name: FinanceApp
options:
  bundleIdPrefix: com.minigarci
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  FinanceApp:
    type: application
    platform: iOS
    sources:
      - path: FinanceApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minigarci.FinanceApp
        PRODUCT_NAME: FinanceApp
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: FinanceApp
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    testTargets:
      - FinanceAppTests
  FinanceAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FinanceAppTests
    dependencies:
      - target: FinanceApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FinanceApp:
    build:
      targets:
        FinanceApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FinanceAppTests
